version: 2.1

jobs:
  build-mac:
    macos:
      xcode: "15.4.0"
    steps:
      - checkout
      - run:
          name: Setup Node.js
          command: |
            brew install node@22
            brew link node@22
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Install Playwright browsers
          command: npx playwright install chromium
      - run:
          name: Bundle engine + Node.js runtime (arm64 + x64)
          command: node build.js
          no_output_timeout: 10m
      - run:
          name: Build Mac app (DMG)
          command: npx electron-builder --mac dmg
      - store_artifacts:
          path: dist
          destination: mac-build
      - run:
          name: Publish DMG to GitHub Release
          command: |
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
            DMG_FILE=$(ls dist/*.dmg 2>/dev/null | head -1)
            if [ -n "$DMG_FILE" ]; then
              echo "Publishing $DMG_FILE as $TAG"
              gh release create "$TAG" "$DMG_FILE" --repo Blazehunterx/founderflow-app --title "FounderFlow $TAG" --notes "Mac DMG installer" || echo "Release may already exist, uploading asset..."
              gh release upload "$TAG" "$DMG_FILE" --repo Blazehunterx/founderflow-app --clobber || echo "Upload failed"
            fi
          env:
            GITHUB_TOKEN: ${GITHUB_TOKEN}

workflows:
  build:
    jobs:
      - build-mac